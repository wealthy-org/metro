name: sample-daily

# Fallback for the Railway cron (Phase 14, KL-40): sample the last complete UTC day into Neon. Needs the repository
# secret DATABASE_URL (RPC_URLS optional; an empty value falls back to the default public pool).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/sample-yesterday.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RPC_URLS: ${{ secrets.RPC_URLS }}
